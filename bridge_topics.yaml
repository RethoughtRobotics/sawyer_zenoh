    qos:
      durability: transient_local
  - topic: /io/robot/state
    type: intera_core_msgs/msg/IONodeStatus
    qos:
      durability: transient_local

  - { topic: /io/robot/robot/command,             type: intera_core_msgs/msg/IOComponentCommand   }

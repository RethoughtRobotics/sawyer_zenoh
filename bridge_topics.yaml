  # ── Robot publish rate ───────────────────────────────────────────────────────
  - { topic: /robot/joint_state_publish_rate, type: std_msgs/msg/UInt16 }

services_2_to_1:

  # ── IK / FK ──────────────────────────────────────────────────────────────────
  - { service: /ExternalTools/right/PositionKinematicsNode/IKService, type: intera_core_msgs/SolvePositionIK }
  - { service: /ExternalTools/right/PositionKinematicsNode/FKService, type: intera_core_msgs/SolvePositionFK }

  # ── Standard types — bridge works natively ───────────────────────────────────
  - { service: /collision/right/tare,          type: std_srvs/Empty }
  - { service: /robot/register_planning_scene, type: std_srvs/Empty }

action_1_to_2:

  # ── TF lookup (tf2_msgs built into both ROS 1 and ROS 2) ─────────────────
  - action: /tf_action
    type: tf2_msgs/LookupTransform

  # ── Sawyer motion execution ───────────────────────────────────────────────
  - action: /motion/motion_command
    type: intera_motion_msgs/MotionCommand

  # ── Robot calibration ────────────────────────────────────────────────────
  - action: /calibration_command
    type: intera_core_msgs/CalibrationCommand

  # ── Camera field calibration ─────────────────────────────────────────────
  - action: /camera_field_calibration
    type: intera_core_msgs/CameraFieldCalibration

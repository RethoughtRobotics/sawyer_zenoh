# Sawyer ROS1 - ROS2 bridge configuration
#
# Loaded onto the ROS1 parameter server with:  rosparam load /bridge_topics.yaml
# Read by parameter_bridge at startup from params:  topics / services_1_to_2
#
# topics          — bidirectional; data flows where it is published
#   type          — ROS 2 message type (bridge auto-maps to ROS 1 via mapping_rules.yaml)
#
# services_1_to_2 — ROS 1 services callable from ROS 2 clients
#   type          — pkg/SrvName  (ROS 1 style, no "srv/" prefix)
#
# NOTE on QoS: The /io/ config and state topics are latched on ROS 1
#   (published once at startup or on change). They need transient_local
#   durability so late-joining ROS 2 subscribers receive the last message.

topics:

  # ── Diagnostics ─────────────────────────────────────────────────────────────
  - { topic: /diagnostics, type: diagnostic_msgs/msg/DiagnosticArray }

  # ── TF ──────────────────────────────────────────────────────────────────────
  - { topic: /tf,        type: tf2_msgs/msg/TFMessage }
  - topic: /tf_static
    type: tf2_msgs/msg/TFMessage
    qos:
      durability: transient_local
      history: keep_all

  # ── Robot enable / reset ─────────────────────────────────────────────────────
  - { topic: /robot/state,            type: intera_core_msgs/msg/RobotAssemblyState }
  - { topic: /robot/set_super_enable, type: std_msgs/msg/Bool  }
  - { topic: /robot/set_super_reset,  type: std_msgs/msg/Empty }
  - { topic: /robot/set_super_stop,   type: std_msgs/msg/Empty }
  - { topic: /robot/in_sim_mode,      type: std_msgs/msg/Bool  }
  - { topic: /robot/set_sim_mode,     type: std_msgs/msg/Bool  }
  - { topic: /robot/set_motor_voltage_low, type: std_msgs/msg/Bool }
  - { topic: /robot/urdf,             type: intera_core_msgs/msg/URDFConfiguration }

  # ── Joints ──────────────────────────────────────────────────────────────────
  - { topic: /robot/joint_states,              type: sensor_msgs/msg/JointState }
  - { topic: /robot/ref_joint_states,          type: sensor_msgs/msg/JointState }
  - { topic: /robot/joint_limits,              type: intera_core_msgs/msg/JointLimits }
  - { topic: /robot/limb/right/joint_command,         type: intera_core_msgs/msg/JointCommand   }
  - { topic: /robot/limb/right/joint_command_timeout, type: std_msgs/msg/Float64                }

  # ── Homing ──────────────────────────────────────────────────────────────────
  - { topic: /robot/homing_states,   type: intera_core_msgs/msg/HomingState    }
  - { topic: /robot/set_homing_mode, type: intera_core_msgs/msg/HomingCommand  }

  # ── Accelerometer ───────────────────────────────────────────────────────────
  - { topic: /robot/accelerometer/right_accelerometer/state, type: sensor_msgs/msg/Imu }

  # ── Head ────────────────────────────────────────────────────────────────────
  - { topic: /robot/head/head_state,       type: intera_core_msgs/msg/HeadState     }
  - { topic: /robot/head/command_head_pan, type: intera_core_msgs/msg/HeadPanCommand}
  - { topic: /robot/head_display,          type: sensor_msgs/msg/Image              }

  # ── Navigators ──────────────────────────────────────────────────────────────
  - { topic: /robot/navigators/head_navigator/state,  type: intera_core_msgs/msg/NavigatorState  }
  - { topic: /robot/navigators/right_navigator/state, type: intera_core_msgs/msg/NavigatorState  }
